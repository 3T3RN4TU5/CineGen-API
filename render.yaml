services:
  - type: web
    name: cinegen-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: API_BASE_URL
        sync: false # set to your Render URL, e.g. https://cinegen-api.onrender.com
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FAL_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SIGNUP_FREE_CREDITS
        value: 20
      - key: DAILY_GENERATION_LIMIT
        value: 10
      - key: JOB_TIMEOUT_MINUTES
        value: 15
      - key: ENABLE_POLLER
        value: true
